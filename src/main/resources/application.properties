spring.application.name=sayatov-zhandos-student-api
server.port=8080
server.error.include-message=always

# Database settings come from environment variables (see docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:student}
spring.jpa.hibernate.ddl-auto=update

app.author=Zhandos Sayatov
app.version=1.1
